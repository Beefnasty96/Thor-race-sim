name: Build vehicle dimension database

on:
  push:
    branches: [vehicle-dimension-db]
    paths: ["tools/vehicle_db/**", ".github/workflows/vehicle_db.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (sample responses) or full (all years and makes)"
        default: probe
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Canadian Vehicle Specifications
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE=$(cat tools/vehicle_db/MODE); fi
          echo "MODE=$MODE" >> $GITHUB_ENV
          if [ "$MODE" = "full" ]; then
            python3 tools/vehicle_db/fetch_cvs.py full vehicle_dimensions.json
          else
            python3 tools/vehicle_db/fetch_cvs.py probe
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vehicle-db-${{ env.MODE }}
          path: |
            probe.json
            vehicle_dimensions.json
          if-no-files-found: error
